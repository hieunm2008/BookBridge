<div class="filter-field"><label for="filter-q">Tìm sách</label><div class="search-control">{% include 'partials/icon.html' with name='search' %}<input id="filter-q" name="q" value="{{ request.GET.q }}" placeholder="Tên sách hoặc môn học"></div></div>
<div class="filter-field"><label for="filter-grade">Lớp</label><select id="filter-grade" name="grade"><option value="">Tất cả lớp</option>{% for grade in grades %}<option value="{{ grade }}" {% if request.GET.grade == grade|stringformat:'s' %}selected{% endif %}>Lớp {{ grade }}</option>{% endfor %}</select></div>
<div class="filter-field"><label for="filter-series">Bộ sách</label><select id="filter-series" name="series"><option value="">Tất cả bộ sách</option>{% for series in series_options %}<option {% if request.GET.series == series %}selected{% endif %}>{{ series }}</option>{% endfor %}</select></div>
<div class="filter-field"><label for="filter-kind">Loại sách</label><select id="filter-kind" name="kind"><option value="">Tất cả loại</option>{% for value,label in kind_options %}<option value="{{ value }}" {% if request.GET.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
