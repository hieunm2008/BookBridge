{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Phân trang">{% if page.has_previous %}<a class="button secondary small" href="?{{ page_query }}&amp;page={{ page.previous_page_number }}">← Trang trước</a>{% endif %}<span>Trang {{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} bản ghi</span>{% if page.has_next %}<a class="button secondary small" href="?{{ page_query }}&amp;page={{ page.next_page_number }}">Trang sau →</a>{% endif %}</nav>{% endif %}
